name: Vanilla sources

on:
  push:
    branches: ["sources-dump"]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Decompile
        run: ./gradlew createMinecraftArtifacts --stacktrace
      - name: Collect
        run: |
          find build -name "*sources*.jar" | head
          mkdir out && cp $(find build -name "*sources*.jar" | head -n1) out/sources.jar
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: out/sources.jar
