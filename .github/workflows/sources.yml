name: Vanilla sources

on:
  push:
    branches: ["sources-dump"]

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Decompile
        run: ./gradlew createMinecraftArtifacts --stacktrace
      - name: Collect
        run: |
          find build -name "*sources*.jar" | head
          mkdir out && cp $(find build -name "*sources*.jar" | head -n1) out/sources.jar
      - name: Commit
        run: |
          mkdir -p ref && cp out/sources.jar ref/sources.jar
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add ref/sources.jar && git commit -m "Decompiled sources" && git push
