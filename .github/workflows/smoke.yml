name: Server smoke test

on:
  push:
    branches: ["equipment"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Start a dedicated server and stop it once it's up
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > run/server.properties
          ( ./gradlew runServer --console=plain > server.log 2>&1 & echo $! > pid )
          for i in $(seq 1 120); do
            if grep -q "Done (" server.log; then echo "server up after ${i}x5s"; break; fi
            if grep -qE "Mixin apply failed|InvalidInjectionException|Exception in server tick loop|Failed to start the minecraft server" server.log; then break; fi
            sleep 5
          done
          pkill -f "net.neoforged" || true
          sleep 5
          grep -nE "Done \(|Mixin|mixin|ERROR|Exception|Caused by" server.log | head -80
          grep -q "Done (" server.log
      - name: Game tests (equipment rules on a mock player)
        run: |
          timeout 900 ./gradlew runGameTestServer --console=plain > gametest.log 2>&1; code=$?
          grep -nE "GameTest|gametest|passed|failed|Mixin|ERROR|Exception|Caused by|assert" gametest.log | grep -v "DEBUG" | head -80
          exit $code

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Start the client on a virtual display and wait for the title screen
        run: |
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri >/dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          ( xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --console=plain > client.log 2>&1 & )
          ok=0
          for i in $(seq 1 150); do
            if grep -qE "Sound engine started|Created: .*blocks.png-atlas" client.log; then ok=1; sleep 20; break; fi
            if grep -qE "Mixin apply failed|InvalidInjectionException|MixinApplyError|Crash report|---- Minecraft Crash Report" client.log; then break; fi
            sleep 5
          done
          pkill -f "net.neoforged" || true; sleep 3
          grep -nE "Mixin|mixin|ERROR|Exception|Caused by|Sound engine|blocks.png-atlas|beyonder" client.log | grep -v "DEBUG" | head -80
          test $ok = 1 && ! grep -qE "Mixin apply failed|InvalidInjectionException|Crash Report" client.log
