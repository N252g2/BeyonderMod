# Builds Tingen in a flat world with the dedicated server, then flies the client around it taking screenshots,
# which are pushed to the 'city-screens' branch. Started by hand.
name: city
on:
  workflow_dispatch:

jobs:
  city:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate the city
        run: |
          pip install --quiet numpy scipy pillow
          python3 tools/city/build_city.py
      - name: Build the city on a dedicated server
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\nlevel-name=smokeworld\nview-distance=6\n' > run/server.properties
          export BEYONDER_CITYTEST=1
          code=0; timeout 3000 ./gradlew runServer --console=plain > server.log 2>&1 || code=$?
          echo "server exit $code"
          grep -nE "City|city|ERROR|Exception|Caused by|could not be read" server.log | head -60
          tail -5 server.log
          mkdir -p run/saves && mv run/smokeworld run/saves/smoke && ls run/saves/smoke
      - name: Fly around the city and take screenshots
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri >/dev/null
          export LIBGL_ALWAYS_SOFTWARE=1 BEYONDER_SELFTEST=1 BEYONDER_CITYTEST=1
          printf 'renderDistance:12\nsimulationDistance:5\ngraphicsMode:1\nmaxFps:30\nonboardAccessibility:false\ntutorialStep:none\nnarrator:0\nfov:0.25\n' > run/options.txt
          timeout 3600 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --console=plain > client.log 2>&1 || true
          grep -nE "selftest|beyonder-selftest|Exception|ERROR|Caused by|Saved screenshot" client.log | grep -v "Narrator\|flite\|OpenAL\|SoundEngine" | head -60
          ls -la run/screenshots || true
      - name: Publish the screenshots to the 'city-screens' branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp run/screenshots/*.png /tmp/shots/ 2>/dev/null || true
          cp client.log server.log /tmp/shots/ 2>/dev/null || true
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan city-tmp && git rm -rq --cached . && rm -rf -- * .github 2>/dev/null || true
          cp /tmp/shots/* . ; git add -f ./*.png client.log server.log 2>/dev/null || true
          git commit -qm "City screenshots" && git push -f origin city-tmp:city-screens
