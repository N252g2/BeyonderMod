name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Check shaders
        run: |
          sudo apt-get install -y -qq glslang-tools >/dev/null
          python3 tools/check_shaders.py glslangValidator

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Package
        id: pkg
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp "$(ls build/libs/beyonder-*.jar | grep -v -- '-sources' | head -n1)" "dist/beyonder-$VERSION.jar"
          (cd shaderpack && zip -q -X -r "../dist/BeyonderShaders-$VERSION.zip" shaders README.txt)
          python3 - "$VERSION" <<'PY'
          import hashlib, json, os, sys
          version = sys.argv[1]
          files = {}
          for kind, name in (("mod", f"beyonder-{version}.jar"), ("shaderpack", f"BeyonderShaders-{version}.zip")):
              data = open(os.path.join("dist", name), "rb").read()
              files[kind] = {"name": name, "size": len(data),
                             "sha1": hashlib.sha1(data).hexdigest(), "sha512": hashlib.sha512(data).hexdigest()}
          json.dump({"version": version, "files": files}, open("dist/release.json", "w"), indent=2)
          PY
          cat dist/release.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: beyonder-build
          path: dist/*

      # Every push to main publishes a build that the pack can point at.
      - name: Publish build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.pkg.outputs.version }}
          TAG="v${VERSION}-build.${{ github.run_number }}"
          {
            echo "Automatic build of \`${GITHUB_SHA::7}\`. The pack reads \`release.json\` for file hashes."
            echo
            echo '```json'
            cat dist/release.json
            echo '```'
          } > notes.md
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" --title "Beyonder $VERSION (build ${{ github.run_number }})" \
            --notes-file notes.md --prerelease
