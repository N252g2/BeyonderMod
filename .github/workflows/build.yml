name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Find jar
        id: jar
        run: |
          JAR=$(ls build/libs/beyonder-*.jar | grep -v -- '-sources' | head -n1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"
          echo "sha1=$(sha1sum "$JAR" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha512=$(sha512sum "$JAR" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: beyonder-mod
          path: ${{ steps.jar.outputs.path }}

      # Every push to main publishes a build that the pack can point at.
      - name: Publish build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-build.${{ github.run_number }}"
          cat > notes.md <<NOTES
          Automatic build of \`${GITHUB_SHA::7}\`.

          | File | Size | SHA-1 | SHA-512 |
          |---|---|---|---|
          | ${{ steps.jar.outputs.name }} | ${{ steps.jar.outputs.size }} | ${{ steps.jar.outputs.sha1 }} | ${{ steps.jar.outputs.sha512 }} |
          NOTES
          gh release create "$TAG" "${{ steps.jar.outputs.path }}" \
            --target "$GITHUB_SHA" --title "Beyonder $VERSION (build ${{ github.run_number }})" \
            --notes-file notes.md --prerelease
